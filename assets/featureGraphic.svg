<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Radial gradient for subtle sci-fi glow -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e2a3a"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>
    <!-- Grid line pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="40" y1="0" x2="40" y2="40" stroke="#1a3050" stroke-width="0.5"/>
      <line x1="0" y1="40" x2="40" y2="40" stroke="#1a3050" stroke-width="0.5"/>
    </pattern>
    <!-- Horizontal scan lines -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="4" y2="2" stroke="#ffffff" stroke-width="0.3" opacity="0.03"/>
    </pattern>
    <!-- Glow filter for the logo -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGlow)"/>

  <!-- Grid overlay -->
  <rect width="1024" height="500" fill="url(#grid)"/>

  <!-- Perspective grid lines converging toward center -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.6">
    <line x1="512" y1="200" x2="0" y2="500"/>
    <line x1="512" y1="200" x2="1024" y2="500"/>
    <line x1="512" y1="200" x2="200" y2="500"/>
    <line x1="512" y1="200" x2="824" y2="500"/>
    <line x1="512" y1="200" x2="100" y2="0"/>
    <line x1="512" y1="200" x2="924" y2="0"/>
  </g>

  <!-- Concentric circles (radar/HUD style) -->
  <g fill="none" stroke="#1a4060" stroke-width="0.5" opacity="0.4">
    <circle cx="512" cy="200" r="80"/>
    <circle cx="512" cy="200" r="160"/>
    <circle cx="512" cy="200" r="240"/>
    <circle cx="512" cy="200" r="320"/>
  </g>

  <!-- Floating dots/particles -->
  <g fill="#3a7abf" opacity="0.4">
    <circle cx="150" cy="80" r="2"/>
    <circle cx="300" cy="120" r="1.5"/>
    <circle cx="720" cy="90" r="1.8"/>
    <circle cx="880" cy="140" r="1.2"/>
    <circle cx="200" cy="350" r="1.5"/>
    <circle cx="850" cy="380" r="2"/>
    <circle cx="400" cy="60" r="1"/>
    <circle cx="650" cy="420" r="1.3"/>
    <circle cx="100" cy="250" r="1.8"/>
    <circle cx="950" cy="280" r="1.5"/>
  </g>

  <!-- Scan lines overlay -->
  <rect width="1024" height="500" fill="url(#scanlines)"/>

  <!-- Watch silhouettes in background -->
  <g opacity="0.08" fill="none" stroke="#4a8abf">
    <!-- Round watch - left side, tilted -->
    <g transform="translate(80, 150) rotate(-15) scale(0.8)">
      <rect x="-12" y="-60" width="24" height="30" rx="6" fill="#4a8abf" stroke="none"/>
      <rect x="-12" y="30" width="24" height="30" rx="6" fill="#4a8abf" stroke="none"/>
      <circle cx="0" cy="0" r="40" stroke-width="6"/>
      <circle cx="0" cy="0" r="3" fill="#4a8abf" stroke="none"/>
    </g>
    <!-- Square watch - far left -->
    <g transform="translate(180, 380) rotate(10) scale(0.7)">
      <rect x="-12" y="-60" width="24" height="25" rx="6" fill="#4a8abf" stroke="none"/>
      <rect x="-12" y="35" width="24" height="25" rx="6" fill="#4a8abf" stroke="none"/>
      <rect x="-35" y="-35" width="70" height="70" rx="12" stroke-width="6"/>
      <rect x="35" y="-8" width="10" height="16" rx="3" fill="#4a8abf" stroke="none"/>
    </g>
    <!-- Round watch - right side -->
    <g transform="translate(880, 120) rotate(8) scale(0.9)">
      <rect x="-12" y="-60" width="24" height="30" rx="6" fill="#4a8abf" stroke="none"/>
      <rect x="-12" y="30" width="24" height="30" rx="6" fill="#4a8abf" stroke="none"/>
      <circle cx="0" cy="0" r="40" stroke-width="6"/>
      <rect x="40" y="-6" width="8" height="12" rx="2" fill="#4a8abf" stroke="none"/>
    </g>
    <!-- Square watch - right bottom -->
    <g transform="translate(920, 350) rotate(-5) scale(0.65)">
      <rect x="-12" y="-60" width="24" height="25" rx="6" fill="#4a8abf" stroke="none"/>
      <rect x="-12" y="35" width="24" height="25" rx="6" fill="#4a8abf" stroke="none"/>
      <rect x="-35" y="-35" width="70" height="70" rx="12" stroke-width="6"/>
    </g>
    <!-- Round watch - top center-left -->
    <g transform="translate(300, 60) rotate(-8) scale(0.5)">
      <rect x="-12" y="-60" width="24" height="30" rx="6" fill="#4a8abf" stroke="none"/>
      <rect x="-12" y="30" width="24" height="30" rx="6" fill="#4a8abf" stroke="none"/>
      <circle cx="0" cy="0" r="40" stroke-width="6"/>
    </g>
    <!-- Square watch - top center-right -->
    <g transform="translate(720, 50) rotate(12) scale(0.5)">
      <rect x="-12" y="-55" width="24" height="22" rx="6" fill="#4a8abf" stroke="none"/>
      <rect x="-12" y="33" width="24" height="22" rx="6" fill="#4a8abf" stroke="none"/>
      <rect x="-30" y="-30" width="60" height="60" rx="10" stroke-width="6"/>
      <rect x="30" y="-5" width="8" height="10" rx="2" fill="#4a8abf" stroke="none"/>
    </g>
    <!-- Round watch - bottom left -->
    <g transform="translate(120, 420) rotate(5) scale(0.55)">
      <rect x="-12" y="-58" width="24" height="28" rx="6" fill="#4a8abf" stroke="none"/>
      <rect x="-12" y="30" width="24" height="28" rx="6" fill="#4a8abf" stroke="none"/>
      <circle cx="0" cy="0" r="38" stroke-width="6"/>
    </g>
  </g>

  <!-- Logo centered, scaled to fit nicely -->
  <g transform="translate(407, 100) scale(0.42)">
    <!-- Square watch case with rounded corners -->
    <rect x="135" y="135" width="240" height="240" rx="24" ry="24"
          fill="none" stroke="#5b5b5b" stroke-width="18"/>
    <!-- Hour markers -->
    <g stroke="#7a7a7a" stroke-linecap="round">
      <line x1="255" y1="148" x2="255" y2="168" stroke-width="8"/>
      <line x1="363" y1="255" x2="343" y2="255" stroke-width="8"/>
      <line x1="255" y1="363" x2="255" y2="343" stroke-width="8"/>
      <line x1="147" y1="255" x2="167" y2="255" stroke-width="8"/>
      <line x1="309" y1="157" x2="303" y2="169" stroke-width="4"/>
      <line x1="353" y1="201" x2="341" y2="207" stroke-width="4"/>
      <line x1="353" y1="309" x2="341" y2="303" stroke-width="4"/>
      <line x1="309" y1="353" x2="303" y2="341" stroke-width="4"/>
      <line x1="201" y1="353" x2="207" y2="341" stroke-width="4"/>
      <line x1="157" y1="309" x2="169" y2="303" stroke-width="4"/>
      <line x1="157" y1="201" x2="169" y2="207" stroke-width="4"/>
      <line x1="201" y1="157" x2="207" y2="169" stroke-width="4"/>
    </g>
    <!-- Watch hands -->
    <g stroke="#f1350d" stroke-width="18" stroke-linecap="round" fill="none">
      <line x1="255" y1="255" x2="187" y2="322"/>
      <line x1="255" y1="255" x2="309" y2="310"/>
    </g>
  </g>

  <!-- Title text -->
  <text x="512" y="320" font-family="sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle" textLength="240" lengthAdjust="spacing">
    wearOH
  </text>

  <!-- Subtitle -->
  <text x="512" y="348" font-family="sans-serif" font-size="16" fill="#7aafdf" text-anchor="middle" textLength="240" lengthAdjust="spacing">
    control on your wrist
  </text>
</svg>
