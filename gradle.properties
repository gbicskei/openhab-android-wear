releaseNotes=Server selection fixes: a healthy local server is now correctly preferred over an unreachable or erroring cloud relay (5xx and stalled connections no longer win the race). Fixed watch settings backup to the server item. FCM token is re-registered when the app or tile opens. Added probe timing to the debug log.
