org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# App versioning (shared between phone and watch modules)
appVersionName=1.9.10
appVersionCodePhone=130
appVersionCodeWatch=129

# Release notes for Google Play (max 500 chars, written during version bump)
releaseNotes=Tile buttons that share the same item now show their own label and icon on the watch, instead of both taking the last button's appearance. The tile editor now warns when a page has more configured buttons than the selected layout can display, so hidden buttons are easy to spot. The editor's theme picker now makes clear it only affects the preview; the actual watch theme is set in Watch Settings.
