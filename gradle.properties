org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# App versioning (shared between phone and watch modules)
appVersionName=1.9.9
appVersionCodePhone=121
appVersionCodeWatch=120

# Release notes for Google Play (max 500 chars, written during version bump)
releaseNotes=Complications now convert units of measurement client-side, so values with a differing display unit (e.g. watts shown as kW) render correctly. Added a read-only flag so tapping a complication can show the value instead of an edit control. Tile SSE and state refresh are scoped to the visible page, cutting unnecessary traffic. The watch's live version is now preferred over a stale cached value. Minor branding fix on unconfigured complications.
